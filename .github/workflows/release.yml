name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (for example 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: dotnet build DecisionKit.slnx -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --solution DecisionKit.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack DecisionKit.slnx -c Release --no-build -o ./nupkg -p:Version=${{ steps.version.outputs.value }}

      - name: Authenticate to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: iamjonatha

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true
